language: csharp
mono: none
sudo: required
dist: xenial
dotnet: 2.2

install:
  - dotnet tool install -g coveralls.net --version 1.3.4

  - dotnet restore

script:
  - dotnet build

  - dotnet test 5-Tests/Crm.Test.csproj -p:CollectCoverage=true -p:CoverletOutputFormat=opencover -p:CoverletOutput=".coverage/coverage.opencover.xml"

  - $HOME/.dotnet/tools/csmacnz.Coveralls -i Crm.Tests/.coverage/coverage.opencover.xml --opencover --repoToken $COVERALLS_REPO_TOKEN --jobId $TRAVIS_JOB_ID --serviceName "travis-ci" --useRelativePaths

  branches:
  only:
  - master
  - develop
  - /^v.*$/