version: 1.0.{build}

pull_requests:
  do_not_increment_build_number: true
  max_jobs: 1

branches:
  only:
    - master
    - develop

image: Visual Studio 2015

platform: Any CPU

before_build:
- cmd: >-
    dotnet restore
    dotnet build

build:
  publish_wap: true
  publish_aspnet_core: true
  verbosity: minimal

test:
  assemblies:
    only:
      - Crm.Test.dll
      - '**\*.Test.dll'