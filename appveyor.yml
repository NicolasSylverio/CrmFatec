version: 1.0.{build}
pull_requests:
  do_not_increment_build_number: true
branches:
  only:
    - master
    - develop
image: Visual Studio 2017
dotnet_csproj:
  patch: true
  file: '**\*.csproj'
  version: '{version}'
  package_version: '{version}'
before_build:
- cmd: >-
    dotnet restore
    dotnet build
build:
  verbosity: minimal
test:
  assemblies:
    only:
      - Crm.Test.dll
      - '**\*.Test.dll'